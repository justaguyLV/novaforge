[package]
name = "novaforge"
version = "0.1.0"
edition = "2021"
description = "NovaForge: a Rust game engine for mobile with ECS, wgpu rendering and Python scripting"
license = "MIT"

[lib]
name = "novaforge"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "novaforge-desktop"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
wgpu = "22"
pollster = "0.3"
hecs = "0.10"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rustpython-vm = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[package.metadata.android]
package = "dev.novaforge.demo"
apk_name = "NovaForge"
build_targets = ["armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application]
label = "NovaForge Demo"

[package.metadata.android.application.activity]
orientation = "landscape"

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "novaforge"
