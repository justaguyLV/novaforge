name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Desktop check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: |
          set -o pipefail
          cargo check --bin novaforge-desktop --color never 2>&1 | tee /tmp/desktop.log
      - name: Publish log
        if: always() && github.ref == 'refs/heads/main'
        run: |
          tail -c 60000 /tmp/desktop.log > /tmp/out.txt || true
          git config --global user.name ci && git config --global user.email ci@example.com
          git clone --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/logs 2>/dev/null || { mkdir /tmp/logs && cd /tmp/logs && git init -q -b ci-logs && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          cd /tmp/logs && cp /tmp/out.txt desktop.txt && git add -A && git commit -qm "desktop log ${{ github.sha }}" && git push -q origin ci-logs

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Build APK
        run: |
          set -o pipefail
          cargo fetch --target armv7-linux-androideabi 2>&1 | tail -2
          for f in $HOME/.cargo/registry/src/*/rustpython-vm-0.4.0/src/stdlib/io.rs; do
            sed -i 's/(status.st_mode & libc::S_IFMT) == libc::S_IFDIR/((status.st_mode as u32) \& (libc::S_IFMT as u32)) == (libc::S_IFDIR as u32)/' "$f"
            grep -n "S_IFDIR" "$f"
          done
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" 2>&1 | tail -3 | tee /tmp/sdk.log
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          keytool -genkeypair -v -keystore release.keystore -storepass novaforge -keypass novaforge -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NovaForge" >/dev/null 2>&1
          cargo fetch --target armv7-linux-androideabi 2>&1 | tail -2
          F=$(ls "$HOME"/.cargo/registry/src/*/rustpython-vm-0.4.0/src/stdlib/io.rs)
          sed -i 's/(status.st_mode \& libc::S_IFMT) == libc::S_IFDIR/(status.st_mode as u32 \& libc::S_IFMT as u32) == libc::S_IFDIR as u32/' "$F"
          grep -n "S_IFMT" "$F" | head -3
          (cargo install cargo-apk --locked && cargo apk build --release --lib) 2>&1 | tee /tmp/android.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NovaForge-apk
          path: target/release/apk/*.apk
      - name: Publish APK as release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" target/release/apk/*.apk --title "NovaForge APK (armv7 32-bit) #${{ github.run_number }}" --notes "Auto-built 32-bit APK"
      - name: Report log as annotation
        if: failure()
        run: |
          grep -v -E "^\s*(Compiling|Downloaded|Downloading|Updating|Locking|Adding|Checking)" /tmp/android.log 2>/dev/null | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}' > /tmp/ann.txt
          echo "::error title=android-log::$(cat /tmp/ann.txt)"
